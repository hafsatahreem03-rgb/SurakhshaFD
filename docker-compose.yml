# One-command setup:  docker compose up --build
# Then open http://localhost:8080  (API docs: http://localhost:8000/docs)
services:
  backend:
    build: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me-surakshafd-secret}
      ALERT_INTERVAL_MINUTES: "60"
      BANK_ADAPTER: simulated
    volumes:
      - surakshafd-data:/app/data
      - ./sample_documents:/app/sample_documents
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  surakshafd-data:
